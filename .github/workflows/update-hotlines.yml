name: Update Mental Health Hotlines

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  update-hotlines:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download latest hotlines
        run: curl -L -o hotlines_temp.json https://raw.githubusercontent.com/sashabaranov/suicide-hotlines/main/suicide-hotlines.json

      - name: Transform to bot format
        run: python .github/scripts/transform_hotlines.py

      - name: Commit & Push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 Auto-update hotlines.json (Weekly)"
          file_pattern: hotlines.json
