name: Update Mental Health Hotlines

on:
  schedule:
    - cron: '0 3 * * 1'        # Every Monday at 3 AM UTC
  workflow_dispatch:

jobs:
  update-hotlines:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download latest hotlines
        run: curl -L -o hotlines_temp.json https://raw.githubusercontent.com/sashabaranov/suicide-hotlines/main/suicide-hotlines.json

      - name: Transform to bot format
        run: python .github/scripts/transform_hotlines.py

      - name: Commit & Push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add hotlines.json
          if ! git diff --staged --quiet; then
            git commit -m "🔄 Auto-update hotlines.json (Weekly)"
            git push
          else
            echo "No changes"
          fi